[package]
name = "protunel"
version = "0.6.1"
description = "Lightweight desktop app (Windows, Linux) for managing SSH SOCKS5 tunnels and local proxies without external SSH tools."
authors = ["Phuc Pham Hong"]
edition = "2021"
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "protunel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
keyring = "4.1.5"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
thiserror = "2.0.19"
russh = { version = "0.62.4", default-features = false, features = ["ring", "flate2", "rsa"] }
fast-socks5 = "1.0.0"
log = "0.4.33"
anyhow = "1.0.104"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.2"
regex = "1.13.1"
ipnet = "2.12.1"
tauri-plugin-dialog = "2"
# Config-export encryption. All of these were already in Cargo.lock as
# transitive dependencies, so promoting them costs no new downloads. `argon2` is
# pinned exactly: a silent bump of the KDF would make existing export files
# undecryptable.
aes-gcm = "0.11.0"
argon2 = "=0.6.0-rc.8"
base64 = "0.22.1"
rand = "0.9.5"
zeroize = { version = "1.9.0", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"
windows-sys = { version = "0.61.2", features = [
  "Win32_Networking_WinInet",
  "Win32_Networking_WinSock",
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_Security",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
# `getifaddrs` for `network.rs`. Already in Cargo.lock via tokio.
libc = "0.2"

# The injected process-capture hook (src-tauri/capture-hook) is a separate
# cdylib artifact built and bundled as a resource — see scripts/build-hook-dll.mjs
# — not linked into this crate. `default-members` keeps `cargo check`/`cargo test`
# scoped to the app only, as CLAUDE.md documents.
[workspace]
members = ["capture-hook"]
default-members = ["."]

