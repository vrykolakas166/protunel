name: Check

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Run every test group
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        description: Run every test group
        type: boolean
        default: true

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-22.04
    outputs:
      full: ${{ steps.select.outputs.full }}
      frontend: ${{ steps.select.outputs.frontend }}
      rust: ${{ steps.select.outputs.rust }}
      ssh-it: ${{ steps.select.outputs.ssh-it }}
      ssh-it-filter: ${{ steps.select.outputs.ssh-it-filter }}
      windows: ${{ steps.select.outputs.windows }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: install bun
        uses: oven-sh/setup-bun@v2

      - name: select test groups
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL: ${{ github.event_name == 'schedule' || inputs.full }}
        run: |
          args=(--emit-github-outputs)
          if [[ "$FULL" == 'true' ]]; then
            args+=(--all)
          elif [[ -n "$BASE" ]]; then
            args+=(--base "$BASE")
          fi
          bun scripts/test-changed.ts "${args[@]}"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: install bun
        uses: oven-sh/setup-bun@v2

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: typecheck and test frontend
        run: bun scripts/test-changed.ts --group frontend

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: install bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      # tauri's build script embeds frontendDist (../dist), which must exist.
      - name: build frontend, check Rust, and run library tests
        run: bun scripts/test-changed.ts --group rust

  ssh-it:
    needs: changes
    if: needs.changes.outputs.ssh-it == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: install bun
        uses: oven-sh/setup-bun@v2

      - name: install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: build frontend
        run: bun run build

      - name: SSH integration tests
        env:
          SSH_IT_FILTER: ${{ needs.changes.outputs.ssh-it-filter }}
        run: bun scripts/test-changed.ts --group ssh-it --filter "$SSH_IT_FILTER"

      - name: upload Compose logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ssh-it-compose-logs
          path: ssh-it-compose.log
          if-no-files-found: ignore

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true' || needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: install bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: build frontend and run Rust library tests
        run: bun scripts/test-changed.ts --group windows

  ci-ok:
    if: always()
    needs: [changes, frontend, rust, ssh-it, windows]
    runs-on: ubuntu-22.04
    steps:
      - name: verify required jobs
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = 'false'
